name: Release

permissions:
  contents: read
  id-token: write # NuGet Trusted Publishing (OIDC)

# Normally invoked by release-please.yml after a release PR is merged. Pushing a
# `v<Version>` tag by hand (Version lives in Directory.Build.props) also works.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0-alpha
        required: true
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack and publish to NuGet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Verify the tag matches <Version>
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          if [ "v$version" != "$tag" ]; then
            echo "::error::Tag '$tag' does not match <Version>$version</Version> in Directory.Build.props."
            exit 1
          fi

      - name: Build
        run: dotnet build XState.slnx -c Release

      - name: Test
        run: dotnet test XState.slnx -c Release --no-build

      - name: W3C SCXML conformance gate
        run: |
          set -o pipefail
          dotnet test XState.slnx -c Release --no-build \
            --filter "FullyQualifiedName~W3cConformanceTests" \
            | tee conformance.log

          if ! grep -qE '^Passed!' conformance.log; then
            echo "::error::W3C conformance suite did not report a passing run."
            exit 1
          fi
          if ! grep -qE 'Failed:[[:space:]]+0,' conformance.log; then
            echo "::error::W3C conformance suite has failing tests."
            exit 1
          fi
          if ! grep -qE 'Skipped:[[:space:]]+0,' conformance.log; then
            echo "::error::W3C conformance suite has skipped tests; the gate requires a fully green run."
            exit 1
          fi
          grep -E 'Passed!|Total:' conformance.log

      - name: Pack
        run: dotnet pack XState.slnx -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      # Trusted Publishing: nuget.org has a policy for statelyai/xstate-csharp + release.yml
      # (owner davidkpiano, packages XState*). NuGet/login exchanges the GitHub OIDC token
      # for a short-lived API key; no stored secret.
      - name: NuGet login (OIDC)
        id: nuget-login
        if: ${{ github.repository == 'statelyai/xstate-csharp' }}
        uses: NuGet/login@v1
        with:
          user: davidkpiano

      - name: Push to NuGet
        if: ${{ github.repository == 'statelyai/xstate-csharp' }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
